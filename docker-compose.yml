services:
  mongo:
    image: mongo:6
    container_name: fpv-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fpv-network
  # Backend (FastAPI) with auto-reload and bind mount
  backend:
    build:
      context: ./fpv-inventory-backend
      dockerfile: Dockerfile
    container_name: fpv-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - DB_NAME=${DB_NAME}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - ./fpv-inventory-backend:/app
    networks:
      - fpv-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Vite dev server) with bind mount
  frontend:
    build:
      context: ./fpv-inventory-react-server
      dockerfile: Dockerfile.dev
    container_name: fpv-frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./fpv-inventory-react-server:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
      - mongo
    networks:
      - fpv-network

networks:
  fpv-network:
    driver: bridge

volumes:
  mongo-data:
